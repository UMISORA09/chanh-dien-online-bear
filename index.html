<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Chánh điện online: nhập pháp danh, an tọa tụng kinh cùng đại chúng, thỉnh chuông, gõ mõ và nghe nhạc thiền.">
<meta name="theme-color" content="#0c0705">
<meta property="og:title" content="Tịnh Tâm · Chánh Điện Online">
<meta property="og:image" content="/assets/hall.jpg">
<title>Tịnh Tâm · Chánh Điện Online</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #0c0705;
  --fg: #f5e9d3;
  --muted: #bda280;
  --gold: #dfa742;
  --gold-light: #ffeaab;
  --red: #8f281a;
  --panel: rgba(26, 12, 7, 0.86);
  --line: rgba(223, 167, 66, 0.42);
  --display: "Noto Serif", Georgia, "Times New Roman", serif;
  --body: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  overflow: hidden;
  user-select: none;
}

#wrap {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}

#stage {
  position: relative;
  aspect-ratio: 9/16;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  overflow: hidden;
  background: #000;
  box-shadow: 0 0 90px rgba(0, 0, 0, 0.85);
}

@media (max-aspect-ratio: 9/16) {
  #stage {
    width: 100%;
    height: auto;
  }
}

#stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: manipulation;
}

/* HUD hiển thị trên Stage */
.hud {
  position: absolute;
  z-index: 5;
  pointer-events: none;
  display: flex;
  gap: 8px;
  align-items: center;
}
.hud * { pointer-events: auto; }

#top {
  top: 12px;
  left: 12px;
  right: 12px;
  justify-content: space-between;
  flex-wrap: wrap;
}

#bottom {
  bottom: 12px;
  left: 12px;
  right: 12px;
  flex-direction: column;
  gap: 8px;
}
.bottom-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 13px;
  font-size: 13px;
  backdrop-filter: blur(8px);
  display: inline-flex;
  gap: 8px;
  align-items: center;
}
.chip b {
  font-family: var(--display);
  font-weight: 600;
  color: var(--gold-light);
}
.n { font-variant-numeric: tabular-nums; }

button {
  font: inherit;
  cursor: pointer;
  border: none;
  outline: none;
}
.btn {
  background: var(--panel);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 500;
  backdrop-filter: blur(8px);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: all 0.2s;
}
.btn:hover {
  border-color: var(--gold);
  background: rgba(45, 20, 10, 0.9);
}
.btn:active { transform: scale(0.96); }

.btn.primary {
  background: linear-gradient(180deg, #9b2b1b, #731e12);
  border-color: #b8452f;
  color: #fff4dc;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.btn.gift {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 10px;
  border-radius: 12px;
  min-width: 62px;
}
.btn.gift small {
  color: var(--muted);
  font-size: 10px;
}
.btn.gift b {
  font-family: var(--display);
  color: var(--gold-light);
  font-size: 13px;
}

#gifts {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  max-width: 100%;
  padding-bottom: 2px;
}

/* Lời Nguyện Bar */
#prayerBar {
  display: flex;
  gap: 6px;
  width: 100%;
}
#prayerInput {
  flex: 1;
  background: rgba(14, 7, 4, 0.85);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 14px;
  color: var(--fg);
  font-size: 12px;
  outline: none;
}
#prayerInput:focus {
  border-color: var(--gold);
}

/* Bảng Công Đức */
#board {
  position: absolute;
  right: 12px;
  top: 56px;
  z-index: 5;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 9px 12px;
  min-width: 155px;
  font-size: 12px;
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
#board h3 {
  margin: 0 0 6px;
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold-light);
  font-weight: 700;
  text-align: center;
}
#board ol {
  margin: 0;
  padding-left: 18px;
  display: grid;
  gap: 3px;
}
#board li span {
  float: right;
  color: var(--gold);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  margin-left: 8px;
}

/* Tin Nhắn Feed */
#feed {
  position: absolute;
  left: 12px;
  bottom: 95px;
  z-index: 4;
  width: 52%;
  max-width: 250px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 25%);
  mask-image: linear-gradient(to bottom, transparent, #000 25%);
}
.msg {
  background: rgba(18, 9, 5, 0.75);
  border: 1px solid rgba(223, 167, 66, 0.25);
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 12px;
  line-height: 1.35;
  overflow-wrap: anywhere;
  backdrop-filter: blur(4px);
  animation: msgIn 0.35s ease-out;
}
.msg b {
  color: var(--gold-light);
  font-weight: 600;
}
.msg.gift {
  background: rgba(138, 42, 30, 0.75);
  border-color: rgba(223, 167, 66, 0.6);
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Cổng Vào Chánh Điện (Entry Gate Dialog) */
#gate {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  background: radial-gradient(ellipse at 50% 35%, rgba(223, 167, 66, 0.2), rgba(12, 7, 5, 0.88) 65%);
  padding: 16px;
}
#gate form {
  width: min(100%, 380px);
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 20px;
  padding: 26px 22px;
  backdrop-filter: blur(14px);
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85);
}
#gate h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 26px;
  margin: 0;
  color: var(--gold-light);
  text-align: center;
}
#gate p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  text-align: center;
}
label {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
input {
  font: inherit;
  font-size: 15px;
  padding: 11px 14px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.4);
  color: var(--fg);
  width: 100%;
}
input:focus {
  border-color: var(--gold);
  outline: none;
}

.skin-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.skin-btn {
  background: rgba(0,0,0,0.35);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 4px;
  color: var(--fg);
  font-size: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.skin-btn[aria-pressed="true"] {
  background: var(--red);
  border-color: var(--gold);
  color: #fff6e5;
}

#toast {
  position: absolute;
  left: 50%;
  top: 14%;
  transform: translateX(-50%);
  z-index: 6;
  background: var(--panel);
  border: 1px solid var(--gold);
  border-radius: 14px;
  padding: 10px 18px;
  font-family: var(--display);
  color: var(--gold-light);
  font-size: 14px;
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
  max-width: 88%;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
#toast.show { opacity: 1; }

.hint {
  font-size: 11px;
  color: var(--muted);
}
[hidden] { display: none !important; }
</style>
</head>
<body>

<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>

    <!-- Top Status HUD -->
    <div id="top" class="hud">
      <span class="chip" id="me" hidden>
        <b id="meName"></b>
        <span class="hint">đang an tọa tụng kinh</span>
      </span>
      <span class="chip">
        <span class="n" id="count">0</span>
        <span>Phật tử</span>
      </span>
    </div>

    <!-- Bảng Công Đức -->
    <div id="board" hidden>
      <h3>✦ Tấm Lòng Thành ✦</h3>
      <ol id="boardList"></ol>
    </div>

    <!-- Chat & Event Feed -->
    <div id="feed" aria-live="polite"></div>

    <!-- Bottom Controls HUD -->
    <div id="bottom" class="hud">
      <!-- Dâng Cúng Dường / Quà Tặng -->
      <div id="gifts" hidden>
        <button class="btn gift" data-coins="1" data-fx="petal"><b>Cánh sen</b><small>1 coin</small></button>
        <button class="btn gift" data-coins="5" data-fx="incense"><b>Dâng hương</b><small>5 coins</small></button>
        <button class="btn gift" data-coins="20" data-fx="lotus"><b>Hoa sen</b><small>20 coins</small></button>
        <button class="btn gift" data-coins="99" data-fx="bell"><b>Thỉnh chuông</b><small>99 coins</small></button>
      </div>

      <!-- Khung Nhập Lời Nguyện Cầu An -->
      <div id="prayerBar" hidden>
        <input id="prayerInput" placeholder="Nhập lời nguyện cầu an, sám hối, chúc phúc…" maxlength="100">
        <button class="btn" id="btnSendPrayer">Nguyện</button>
      </div>

      <!-- Action Buttons Row -->
      <div class="bottom-bar">
        <span style="display:flex;gap:6px" id="sfxButtons" hidden>
          <button class="btn" id="btnBell" title="Thỉnh chuông">🔔 Chuông</button>
          <button class="btn" id="btnMo" title="Gõ mõ">🪵 Mõ</button>
        </span>
        <span style="display:flex;gap:6px;margin-left:auto">
          <button class="btn" id="nextTrack" hidden title="Bài kế tiếp"><span id="nowPlaying">♪ Nhạc</span> ›</button>
          <button class="btn" id="mute" hidden>Tắt nhạc</button>
          <button class="btn" id="leave" hidden>Rời</button>
        </span>
      </div>
    </div>

    <div id="toast" role="status"></div>

    <!-- Cổng Vào (Entry Gate) -->
    <div id="gate">
      <form id="gateForm">
        <h1>Chánh Điện Tịnh Tâm</h1>
        <p>Nhập pháp danh và chọn y phục rồi bước vào an tọa cùng đại chúng tu tập, nghe nhạc thiền, thỉnh chuông gõ mõ.</p>
        
        <label for="dharma">Pháp danh / Tên Phật tử</label>
        <input id="dharma" name="dharma" maxlength="20" autocomplete="nickname" placeholder="Ví dụ: Diệu Hạnh, Minh Tâm, Thiện Đức…" required>

        <label>Chọn y phục</label>
        <div class="skin-selector" id="skinSelector">
          <button type="button" class="skin-btn" data-skin="man" aria-pressed="true">
            <span>Nam áo lam</span>
          </button>
          <button type="button" class="skin-btn" data-skin="woman" aria-pressed="false">
            <span>Nữ áo lam</span>
          </button>
          <button type="button" class="skin-btn" data-skin="granny" aria-pressed="false">
            <span>Áo nâu sòng</span>
          </button>
          <button type="button" class="skin-btn" data-skin="monk" aria-pressed="false">
            <span>Chư Tăng</span>
          </button>
          <button type="button" class="skin-btn" data-skin="nun" aria-pressed="false">
            <span>Chư Ni</span>
          </button>
          <button type="button" class="skin-btn" data-skin="child" aria-pressed="false">
            <span>Chú tiểu</span>
          </button>
        </div>

        <button type="submit" class="btn primary">Vào Chánh Điện</button>
        <div class="hint" style="text-align:center" id="voiceInfo">Đang dò tìm giọng đọc tiếng Việt…</div>
      </form>
    </div>
  </div>
</div>

<script>
/* ==============================================================
   1. Canvas Stage & Tải Hình Ảnh (Assets)
   ============================================================== */
const SW = 1080, SH = 1920;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const A = {};
const ASSETS = {
  hall: 'assets/hall.jpg',
  monk: 'assets/c_monk.png',
  nun: 'assets/c_nun.png',
  granny: 'assets/c_granny.png',
  man: 'assets/c_man.png',
  woman: 'assets/c_woman.png',
  child: 'assets/c_child.png',
  anim_man: 'assets/anim_man.png',
  anim_woman: 'assets/anim_woman.png',
  anim_granny: 'assets/anim_granny.png',
  lotus: 'assets/fx_lotus.png',
  halo: 'assets/fx_halo.png',
  bell: 'assets/fx_bell.png',
  incense: 'assets/fx_incense.png',
  petal: 'assets/fx_petal.png'
};

for (const [k, src] of Object.entries(ASSETS)) {
  const im = new Image();
  im.src = src;
  A[k] = im;
}

const ANIM = {
  man: { fw: 212, fh: 300, seatH: 210 },
  woman: { fw: 212, fh: 300, seatH: 220 },
  granny: { fw: 195, fh: 300, seatH: 222 }
};
const hasAnim = k => ANIM[k] && A['anim_' + k] && A['anim_' + k].naturalWidth > 0;

/* ==============================================================
   2. Sắp Xếp Chỗ Ngồi (36 Bồ Đoàn Hình Thang)
   ============================================================== */
const FLOOR = { yTop: 1130, yBot: 1790, xHalfTop: 240, xHalfBot: 400 };
const ROWS = 6, COLS = 6, AISLE = 0.9;
const seats = [];

for (let r = 0; r < ROWS; r++) {
  const t = (r + 0.55) / ROWS;
  const y = FLOOR.yTop + (FLOOR.yBot - FLOOR.yTop) * t;
  const half = FLOOR.xHalfTop + (FLOOR.xHalfBot - FLOOR.xHalfTop) * t;
  const scale = 0.22 + 0.33 * t;
  for (let c = 0; c < COLS; c++) {
    let u = (c - (COLS - 1) / 2) / ((COLS - 1) / 2);
    u += Math.sign(u) * AISLE / (COLS - 1);
    seats.push({ x: SW / 2 + u * half, y, scale, r, c, taken: null });
  }
}
seats.sort((a, b) => (b.r - a.r) || (Math.abs(a.x - SW / 2) - Math.abs(b.x - SW / 2)));
const DOOR = { x: SW / 2, y: SH + 120 };

/* ==============================================================
   3. Quản Lý Phật Tử & Khách Mẫu
   ============================================================== */
const visitors = [], fx = [], floaters = [];
const SKINS = ['man', 'woman', 'granny', 'man', 'woman', 'nun', 'monk', 'child'];
function freeSeat() { return seats.find(s => !s.taken) || null; }

function addVisitor(name, skin, instant, isMe) {
  const seat = freeSeat();
  if (!seat) return null;
  const v = {
    name, skin, seat,
    x: instant ? seat.x : DOOR.x,
    y: instant ? seat.y : DOOR.y,
    state: instant ? 'sit' : 'walk',
    t: 0, frame: 7, ft: 0, sitT: -1,
    flip: false, fade: instant ? 1 : 0,
    bob: 0, bow: 0, glow: 0, coins: 0,
    isMe: !!isMe,
    bubble: null,
    phase: Math.random() * 6.28
  };
  seat.taken = v;
  visitors.push(v);
  updateCount();
  return v;
}

function removeVisitor(v) {
  if (!v) return;
  v.seat.taken = null;
  const idx = visitors.indexOf(v);
  if (idx !== -1) visitors.splice(idx, 1);
  updateCount();
}

const countEl = document.getElementById('count');
function updateCount() { countEl.textContent = visitors.length; }

const DEMO = [
  'Diệu Hạnh', 'Minh Tâm', 'Thiện Đức', 'Huệ An', 'Tịnh Nhã', 'Quảng Trí',
  'Chơn Như', 'Pháp Hỷ', 'Nguyên Thanh', 'Tâm Đăng', 'Diệu Liên', 'Trí Hải',
  'Phước Lộc', 'Hạnh Nguyện', 'Như Ý', 'Bảo Châu', 'Thanh Lương', 'Từ Tâm'
];
DEMO.forEach((n, i) => {
  const v = addVisitor(n, SKINS[i % SKINS.length], true);
  if (v) v.coins = [120, 80, 55, 30, 20, 12, 8, 5][i] || 0;
});

/* ==============================================================
   4. Hệ Thống Âm Thanh (Web Audio & SpeechSynthesis)
   ============================================================== */
let AC = null, master = null, muted = false, mokTimer = null, bellTimer = null, me = null, haloPulse = 0;
const TRACKS = [
  { src: 'assets/music/music1.mp3', name: 'Trăng Trên Rừng Trúc' },
  { src: 'assets/music/music2.mp3', name: 'Hơi Thở Ban Mai' }
];
let musicGain = null, musicEls = [], trackIdx = 0;

function audioStart() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain();
  master.gain.value = 0.85;
  master.connect(AC.destination);

  musicGain = AC.createGain();
  musicGain.gain.value = 0.55;
  musicGain.connect(master);

  playTrack(Math.floor(Math.random() * TRACKS.length));
  deepBell();
  bellTimer = setInterval(() => bell(false), 45000);
  mokTimer = setInterval(mok, 1150);
}

function playTrack(i) {
  if (!AC) return;
  trackIdx = (i + TRACKS.length) % TRACKS.length;
  const tr = TRACKS[trackIdx];
  const el = new Audio(tr.src);
  el.crossOrigin = 'anonymous';
  const src = AC.createMediaElementSource(el), g = AC.createGain();
  g.gain.value = 0;
  src.connect(g);
  g.connect(musicGain);

  const now = AC.currentTime;
  g.gain.linearRampToValueAtTime(1, now + 3);

  for (const old of musicEls) {
    old.g.gain.cancelScheduledValues(now);
    old.g.gain.setValueAtTime(old.g.gain.value, now);
    old.g.gain.linearRampToValueAtTime(0, now + 3);
    setTimeout(() => { try { old.el.pause(); } catch {} }, 3200);
  }
  musicEls = [{ el, g }];
  el.addEventListener('timeupdate', () => {
    if (el.duration && el.duration - el.currentTime < 3 && !el._next) {
      el._next = true;
      playTrack(trackIdx + 1);
    }
  });
  el.play().catch(() => {});
  const nt = document.getElementById('nowPlaying');
  if (nt) nt.textContent = '♪ ' + tr.name;
}

function setDuck(on) {
  if (!musicGain || !AC) return;
  const t = AC.currentTime;
  musicGain.gain.cancelScheduledValues(t);
  musicGain.gain.setValueAtTime(musicGain.gain.value, t);
  musicGain.gain.linearRampToValueAtTime(on ? 0.15 : 0.55, t + 0.4);
}

function bell(big = false) {
  if (!AC || muted) return;
  const t = AC.currentTime, k = big ? 1.6 : 1.0;
  for (const [f, a, d] of [[432, 0.5, 6], [864, 0.3, 4.5], [1296, 0.18, 3.2]]) {
    const o = AC.createOscillator();
    o.type = 'sine';
    o.frequency.value = f / (big ? 1.5 : 1);
    const g = AC.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(a * k * 0.7, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0005, t + d * k);
    o.connect(g);
    g.connect(master);
    o.start(t);
    o.stop(t + d * k + 0.1);
  }
  haloPulse = Math.max(haloPulse, big ? 1.5 : 1.0);
}

function deepBell() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  for (const [f, a, d] of [[108, 0.7, 10], [216, 0.5, 8], [324, 0.3, 6]]) {
    const o = AC.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    const g = AC.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(a * 0.8, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0002, t + d);
    o.connect(g);
    g.connect(master);
    o.start(t);
    o.stop(t + d + 0.1);
  }
  haloPulse = 1.6;
}

function mok() {
  if (!AC || muted || !me) return;
  const t = AC.currentTime;
  const o = AC.createOscillator();
  o.type = 'triangle';
  o.frequency.setValueAtTime(700, t);
  o.frequency.exponentialRampToValueAtTime(370, t + 0.04);
  const bp = AC.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 720;
  bp.Q.value = 3.8;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.35, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(bp);
  bp.connect(g);
  g.connect(master);
  o.start(t);
  o.stop(t + 0.14);
}

let viVoice = null;
function pickViVoice() {
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^vi([-_]|$)/i.test(v.lang));
    const rank = v => (/natural|online|neural/i.test(v.name) ? 4 : 0) + (/hoaimy|namminh/i.test(v.name) ? 2 : 0) + (/google/i.test(v.name) ? 1 : 0);
    viVoice = vs.sort((a, b) => rank(b) - rank(a))[0] || null;
  } catch {
    viVoice = null;
  }
  const el = document.getElementById('voiceInfo');
  if (el) {
    el.textContent = viVoice ? 'Giọng đọc tiếng Việt: ' + viVoice.name : 'Chưa có giọng đọc tiếng Việt trên trình duyệt (hiển thị chữ)';
  }
}
if ('speechSynthesis' in window) {
  pickViVoice();
  speechSynthesis.addEventListener('voiceschanged', pickViVoice);
}

function ttsSpeak(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    if (!viVoice) pickViVoice();
    if (!viVoice) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = viVoice;
    u.lang = viVoice.lang;
    u.rate = 0.95;
    u.pitch = 0.95;
    u.onstart = () => setDuck(true);
    u.onend = u.onerror = () => setDuck(false);
    speechSynthesis.speak(u);
  } catch {}
}

/* ==============================================================
   5. Feed, Bảng Công Đức & Thông Báo Toast
   ============================================================== */
const feed = document.getElementById('feed'), toast = document.getElementById('toast');

function say(name, text, gift) {
  const d = document.createElement('div');
  d.className = 'msg' + (gift ? ' gift' : '');
  d.innerHTML = '<b></b> ';
  d.firstChild.textContent = name;
  d.append(text);
  feed.append(d);
  while (feed.children.length > 7) feed.firstChild.remove();
}

function showToast(t) {
  toast.textContent = t;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 3800);
}

function renderBoard() {
  const top = [...visitors].filter(v => v.coins > 0).sort((a, b) => b.coins - a.coins).slice(0, 4);
  const ol = document.getElementById('boardList');
  ol.innerHTML = '';
  for (const v of top) {
    const li = document.createElement('li');
    li.textContent = v.name;
    const s = document.createElement('span');
    s.textContent = v.coins + ' ✧';
    li.append(s);
    ol.append(li);
  }
  document.getElementById('board').hidden = top.length === 0;
}
renderBoard();

/* ==============================================================
   6. Cúng Dường & Gửi Lời Nguyện
   ============================================================== */
const SUTRA = [
  'Nam mô A Di Đà Phật',
  'Nam mô Bổn Sư Thích Ca Mâu Ni Phật',
  'Nam mô Đại Bi Quán Thế Âm Bồ Tát',
  'Nguyện cầu gia đạo bình an, cát tường như ý',
  'Cầu cho cha mẹ được mạnh khỏe, tăng phúc tăng thọ',
  'Nguyện đem công đức này hướng về khắp tất cả chúng sinh',
  'Nguyện thân tâm an lạc, phiền não tiêu trừ'
];

function donate(v, coins, kind, text) {
  v.coins += coins;
  v.glow = 1.0;
  v.bow = 1.0;
  const big = coins >= 99;

  fx.push({
    kind,
    x: v.seat.x,
    y: v.seat.y - 120 * v.seat.scale,
    t: 0,
    life: big ? 3.4 : 2.2,
    scale: v.seat.scale * (big ? 1.6 : 1.1)
  });

  for (let i = 0; i < (big ? 20 : coins >= 20 ? 8 : 3); i++) {
    floaters.push({
      x: v.seat.x + (Math.random() - 0.5) * 160 * v.seat.scale,
      y: v.seat.y - 60,
      vx: (Math.random() - 0.5) * 35,
      vy: -(60 + Math.random() * 85),
      t: 0,
      life: 2.6 + Math.random(),
      s: 0.18 + Math.random() * 0.15
    });
  }

  if (big) {
    deepBell();
    for (let i = 0; i < 28; i++) {
      floaters.push({
        x: SW / 2 + (Math.random() - 0.5) * 550,
        y: 280 + Math.random() * 300,
        vx: (Math.random() - 0.5) * 45,
        vy: 20 + Math.random() * 45,
        t: 0,
        life: 4.5,
        s: 0.22 + Math.random() * 0.15
      });
    }
  }

  const label = { petal: 'Cánh sen', incense: 'Dâng hương', lotus: 'Hoa sen', bell: 'Thỉnh chuông' }[kind];
  say(v.name, ` đã dâng ${label} ×${coins}` + (text ? ` · "${text}"` : ''), true);
  showToast(`${v.name} dâng ${label}` + (text ? ` — ${text}` : ''));
  ttsSpeak(`${v.name} dâng ${label}. ${text || ''}`);
  renderBoard();
}

function sendMyPrayer(text) {
  if (!me || !text.trim()) return;
  me.bow = 1.0;
  me.glow = 0.8;
  me.bubble = { text, until: performance.now() + 6000 };
  say(me.name, ' ' + text);
  showToast(`Phật tử ${me.name}: "${text}"`);
  ttsSpeak(`Phật tử ${me.name} phát nguyện: ${text}`);

  for (let i = 0; i < 4; i++) {
    floaters.push({
      x: me.seat.x + (Math.random() - 0.5) * 60,
      y: me.seat.y - 80,
      vx: (Math.random() - 0.5) * 20,
      vy: -70,
      t: 0,
      life: 2.2,
      s: 0.14
    });
  }
}

/* ==============================================================

const gate = document.getElementById('gate'), form = document.getElementById('gateForm'), input = document.getElementById('dharma');

canvas.addEventListener('pointerdown', () => {

// Hoạt động mô phỏng của đại chúng
setInterval(() => {
  if (visitors.length < 2) return;

  if (v === me) return;
  if (Math.random() < 0.3) {

  } else {
    say(v.name, ' ' + SUTRA[Math.floor(Math.random() * SUTRA.length)]);
    v.bow = 1.0;
  }
}, 4500);

/* ==============================================================
   8. Vẽ Đồ Họa 2.5D Chánh Điện (Render Loop)
   ============================================================== */
let last = performance.now();

function resize() {
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  ctx.setTransform(w / SW, 0, 0, h / SH, 0, 0);
}

function drawSprite(im, x, y, s, anchorY = 1) {
  if (!im?.naturalWidth) return;
  const w = im.naturalWidth * s, h = im.naturalHeight * s;
  ctx.drawImage(im, x - w / 2, y - h * anchorY, w, h);
}

function nameTag(text, x, y, s, isMe) {
  ctx.font = `600 ${Math.round(26 * s + 8)}px "Noto Serif", Georgia, serif`;
  const w = ctx.measureText(text).width + 18, h = 30 * s + 10;
  ctx.fillStyle = isMe ? 'rgba(145, 42, 28, 0.92)' : 'rgba(18, 10, 7, 0.72)';
  roundRect(x - w / 2, y - h / 2, w, h, h / 2);
  ctx.fill();

  ctx.strokeStyle = isMe ? 'rgba(255, 220, 130, 0.95)' : 'rgba(223, 167, 66, 0.5)';
  ctx.lineWidth = isMe ? 2.5 : 1.2;
  ctx.stroke();

  ctx.fillStyle = isMe ? '#ffeebf' : '#f5e9d3';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y + 1);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBubble(text, x, y, s) {
  const fs = Math.max(17, Math.round(24 * s / 0.4));
  ctx.font = `500 ${fs}px "Be Vietnam Pro", system-ui, sans-serif`;
  let t = text;
  while (ctx.measureText(t).width > 300 && t.length > 4) t = t.slice(0, -2);
  if (t !== text) t = t.trimEnd() + '…';
  const w = ctx.measureText(t).width + fs * 1.2, h = fs * 1.6;

  ctx.fillStyle = 'rgba(255, 248, 235, 0.95)';
  roundRect(x - w / 2, y - h, w, h, fs * 0.5);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x - 7, y);
  ctx.lineTo(x + 7, y);
  ctx.lineTo(x, y + 9);
  ctx.fill();

  ctx.fillStyle = '#3a1a08';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y - h / 2 + 1);
}

function tick(now) {
  requestAnimationFrame(tick);
  resize();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const t = now / 1000;

  ctx.clearRect(0, 0, SW, SH);

  // 1. Phông Nền Chánh Điện
  if (A.hall.naturalWidth) {
    ctx.drawImage(A.hall, 0, 0, SW, SH);
  } else {
    ctx.fillStyle = '#1a0d08';
    ctx.fillRect(0, 0, SW, SH);
  }

  // 2. Hào Quang Đức Phật Tỏa Sáng (Golden Divine Radiance)
  haloPulse = Math.max(0, haloPulse - dt * 0.45);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const hx = SW / 2, hy = 570;
  const rMax = 320 + haloPulse * 80;

  const auraGrad = ctx.createRadialGradient(hx, hy, 40, hx, hy, rMax);
  auraGrad.addColorStop(0, `rgba(255, 235, 160, ${0.35 + 0.1 * Math.sin(t * 1.5) + haloPulse * 0.4})`);
  auraGrad.addColorStop(0.4, `rgba(240, 180, 70, ${0.16 + 0.05 * Math.sin(t * 2)})`);
  auraGrad.addColorStop(1, 'rgba(210, 140, 30, 0)');
  ctx.fillStyle = auraGrad;
  ctx.beginPath();
  ctx.arc(hx, hy, rMax, 0, Math.PI * 2);
  ctx.fill();

  ctx.lineWidth = 4 + haloPulse * 3;
  ctx.strokeStyle = `rgba(255, 225, 130, ${0.38 + 0.12 * Math.sin(t * 1.8) + haloPulse * 0.4})`;
  ctx.beginPath();
  ctx.arc(hx, 520, 145, 0, Math.PI * 2);
  ctx.stroke();

  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(255, 210, 100, 0.25)';
  ctx.beginPath();
  ctx.arc(hx, 520, 170, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // 3. Khói Hương Nghi Ngút (Bay nhẹ từ lư hương ở bàn thờ lên)
  ctx.save();
  for (let i = 0; i < 14; i++) {
    const a = (t * 0.07 + i * (1 / 14)) % 1;
    const y = 1040 - a * 260;
    const sway = Math.sin(t * 1.5 + i * 2) * 16 * a;
    const x = SW / 2 + sway;
    const radius = 5 + a * 18;
    ctx.fillStyle = `rgba(240, 230, 215, ${0.22 * (1 - a) * Math.sin(a * Math.PI)})`;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // 4. Ánh Nến Bập Bùng
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.06 + 0.04 * Math.sin(t * 8.5) * Math.sin(t * 13.3);
  ctx.fillStyle = '#ffb347';
  ctx.fillRect(0, 300, SW, 900);
  ctx.restore();

  // 5. Chư Tăng và Phật Tử An Tọa (Sắp xếp theo độ sâu)
  const order = [...visitors].sort((a, b) => a.y - b.y);
  const bubbles = [];

  for (const v of order) {
    const anim = hasAnim(v.skin);
    if (v.state === 'walk') {
      if (!anim) {
        v.x = v.seat.x;
        v.y = v.seat.y;
        v.state = 'sit';
      } else {
        const depth = (v.y - FLOOR.yTop) / (FLOOR.yBot - FLOOR.yTop);
        const sp = (150 + 170 * Math.max(0, Math.min(1.4, depth))) * dt;
        const dx = v.seat.x - v.x, dy = v.seat.y - v.y;
        if (Math.abs(dy) > 3) {
          v.y += Math.max(-sp, Math.min(sp, dy));
          v.x += (SW / 2 - v.x) * Math.min(1, dt * 6);
          v.flip = false;
        } else {
          v.x += Math.max(-sp, Math.min(sp, dx));
          v.flip = dx < 0;
        }
        v.ft += dt;
        if (v.ft > 0.16) {
          v.ft = 0;
          v.frame = (v.frame + 1) % 4;
        }
        if (Math.abs(v.x - v.seat.x) < 2 && Math.abs(v.y - v.seat.y) < 3) {
          v.x = v.seat.x;
          v.y = v.seat.y;
          v.state = 'sitting';
          v.sitT = 0;
          v.flip = false;
        }
      }
    } else if (v.state === 'sitting') {
      v.sitT += dt;
      v.frame = 4 + Math.min(3, Math.floor(v.sitT / 0.22));
      if (v.sitT > 0.9) {
        v.state = 'sit';
        v.frame = 7;
        if (v.isMe) showToast('Đã an tọa. Nam mô A Di Đà Phật.');
      }
    }

    v.fade = Math.min(1, v.fade + dt * 2);
    const sc = v.state === 'walk'
      ? (0.22 + 0.33 * ((v.y - FLOOR.yTop) / (FLOOR.yBot - FLOOR.yTop)))
      : v.seat.scale;
    const s = Math.max(0.2, Math.min(0.75, sc));
    v.bow = Math.max(0, v.bow - dt * 0.7);
    v.glow = Math.max(0, v.glow - dt * 0.5);

    const breathe = v.state === 'sit' ? Math.sin(t * 1.1 + v.phase) * 2 * s : 0;

    if (v.glow > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = v.glow * 0.7;
      const g = ctx.createRadialGradient(v.x, v.y - 90 * s, 10, v.x, v.y - 90 * s, 170 * s);
      g.addColorStop(0, 'rgba(255,205,115,.95)');
      g.addColorStop(1, 'rgba(255,160,60,0)');
      ctx.fillStyle = g;
      ctx.fillRect(v.x - 200 * s, v.y - 300 * s, 400 * s, 340 * s);
      ctx.restore();
    }

    const bowK = v.state === 'sit' ? Math.sin(Math.min(1, v.bow) * Math.PI) * 0.04 : 0;
    ctx.save();
    ctx.globalAlpha = v.fade;
    ctx.translate(v.x, v.y);
    if (bowK > 0) ctx.transform(1, 0, 0, 1 - bowK, 0, 0);

    let tagH;
    if (anim) {
      const a = ANIM[v.skin], k = s * 1.05 * 260 / a.seatH;
      if (v.flip) ctx.scale(-1, 1);
      ctx.drawImage(A['anim_' + v.skin], v.frame * a.fw, 0, a.fw, a.fh, -a.fw * k / 2, -a.fh * k + breathe, a.fw * k, a.fh * k);
      tagH = (v.state === 'sit' ? a.seatH : a.fh * 0.97) * k;
    } else {
      drawSprite(A[v.skin] || A.man, 0, breathe, s * 1.05, 1);
      tagH = 268 * s;
    }
    ctx.restore();

    nameTag(v.name, v.x, v.y - tagH - 10 * s, s, v.isMe);

    if (v.bubble && now < v.bubble.until) {
      bubbles.push([v.bubble.text, v.x, v.y - tagH - 30 * s, s]);
    } else {
      v.bubble = null;
    }
  }

  for (const b of bubbles) drawBubble(...b);

  // 6. Hiệu Ứng Lễ Phẩm Bay Lên
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i];
    f.t += dt;
    const k = f.t / f.life;
    if (k >= 1) {
      fx.splice(i, 1);
      continue;
    }
    const im = A[f.kind];
    const pop = Math.min(1, f.t * 4);
    const ease = 1 - Math.pow(1 - pop, 3);
    ctx.save();
    ctx.globalAlpha = k < 0.75 ? 1 : (1 - k) / 0.25;
    drawSprite(im, f.x, f.y - k * 160, f.scale * (0.6 + 0.4 * ease) * 0.9, 1);
    ctx.restore();
    if (f.kind === 'bell' && f.t < 0.1) haloPulse = 1;
  }

  // 7. Cánh Sen Rơi Bay Bổng
  for (let i = floaters.length - 1; i >= 0; i--) {
    const p = floaters[i];
    p.t += dt;
    if (p.t > p.life) {
      floaters.splice(i, 1);
      continue;
    }
    p.x += p.vx * dt + Math.sin(p.t * 3 + i) * 20 * dt;
    p.y += p.vy * dt;
    ctx.save();
    ctx.globalAlpha = Math.min(1, (p.life - p.t));
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.sin(p.t * 2 + i) * 0.6);
    drawSprite(A.petal, 0, 0, p.s, 0.5);
    ctx.restore();
  }
}

requestAnimationFrame(tick);
</script>
